<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — Conviction Logs</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/messages.css" />
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="nav-logo-primary">Conviction Logs</span>
        <span class="nav-logo-sub">Investment Journal</span>
      </a>
      <div class="nav-links">
        <a href="index.html"     class="nav-link">Dashboard</a>
        <a href="portfolio.html" class="nav-link">Portfolio</a>
        <a href="journal.html"   class="nav-link">Journal</a>
        <a href="watchlist.html" class="nav-link">Watchlist</a>
        <a href="settings.html"  class="nav-link">Settings</a>
        <a href="admin.html"     class="nav-link" style="color:var(--red);opacity:.6">Admin</a>
      </div>
      <div class="nav-actions">
        <span id="sync-status-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#c9a84c;margin-right:4px;flex-shrink:0;transition:background .3s ease"></span>
        <a href="notifications.html" class="btn btn-ghost btn-sm active" id="nav-notif-btn" style="display:none">
          🔔 <span id="nav-notif-count" class="notif-badge" style="display:none"></span>
        </a>
        <a href="login.html" id="nav-login-btn" class="btn btn-ghost btn-sm">Sign In</a>
        <div id="nav-user-menu" class="nav-user-menu" style="display:none">
          <div class="nav-user-initials" id="nav-user-initials">?</div>
          <img class="nav-user-avatar" id="nav-user-avatar" src="" alt="" />
          <span class="nav-user-name" id="nav-user-name"></span>
          <button class="btn btn-ghost btn-sm" onclick="Auth.signOut()">Sign Out</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="page-wrapper">
    <div class="container">
      <div class="section animate-up">
        <div class="section-header">
          <h1 class="section-title">Notifi<span>cations</span></h1>
          <button class="btn btn-ghost btn-sm" onclick="Notifications.markAllRead()">Mark all read</button>
        </div>
        <div id="notif-list" class="notif-list"></div>
      </div>
    </div>

    <footer class="footer">
      <div class="container footer-inner">
        <span class="footer-copy">© <span id="footer-year"></span> Conviction Logs</span>
      </div>
    </footer>
  </main>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/follows.js"></script>
  <script src="js/share.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
